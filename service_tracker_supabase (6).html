<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans TC',sans-serif;background:#0f172a;color:#e2e8f0;display:flex;height:100vh;overflow:hidden}
:root{--red:#b91c1c;--sw:230px;--hh:56px}

/* SIDEBAR */
.sidebar{width:var(--sw);background:#1e293b;border-right:1px solid #334155;display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto;overflow-x:hidden;transition:transform .25s}
.logo{padding:16px 20px;border-bottom:1px solid #334155;display:flex;align-items:center;gap:10px}
.logo-ico{width:30px;height:30px;border-radius:7px;background:rgba(185,28,28,.2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo-ico svg{width:16px;height:16px;stroke:#ef4444;fill:none;stroke-width:2}
.logo-brand{font-size:11px;color:#94a3b8}
.logo-title{font-size:13px;font-weight:600;color:#f1f5f9}
.nav-sec{padding:6px 0;border-bottom:1px solid #263248}
.nav-lbl{padding:10px 20px 4px;font-size:10px;color:#64748b;font-weight:600;letter-spacing:.8px;text-transform:uppercase}
.nb{width:100%;display:flex;align-items:center;gap:10px;padding:9px 20px;border:none;background:transparent;color:#94a3b8;cursor:pointer;font-size:12.5px;text-align:left;border-left:3px solid transparent;transition:all .15s;font-family:inherit}
.nb:hover{background:rgba(185,28,28,.12);color:#f1f5f9}
.nb.active{background:rgba(185,28,28,.18);color:#fff;border-left-color:#b91c1c;font-weight:600}
.nb .ico{width:15px;height:15px;flex-shrink:0;opacity:.65}
.nb.active .ico{opacity:1}
.nb.sub{padding-left:36px;font-size:12px}
.sf{margin-top:auto;padding:12px 20px;border-top:1px solid #334155;font-size:11px;color:#475569}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;background:#f3f4f6}
.header{height:var(--hh);background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;padding:0 20px;gap:12px;flex-shrink:0}
.hbar{width:3px;height:22px;background:#b91c1c;border-radius:2px;flex-shrink:0}
.hbc{font-size:11px;color:#9ca3af}
.htitle{font-size:16px;font-weight:600;color:#111827}
.hmenu{display:none;background:none;border:none;cursor:pointer;padding:8px;color:#374151;margin-left:auto}
.hmenu svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2}
.content{flex:1;overflow-y:auto;padding:20px}

/* OVERLAY */
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:99}
.ov.show{display:block}
@media(max-width:820px){
  .sidebar{position:fixed;left:0;top:0;height:100vh;z-index:100;transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .hmenu{display:flex}
  .content{padding:14px}
  .fg,.fg.g3{grid-template-columns:1fr!important}
  .f-grp.full{grid-column:1!important}
  .modal{max-width:100%!important}
  .adm-wrap{grid-template-columns:1fr!important}
  .twrap{display:none}
  .card-list{display:flex!important}
}

/* LOADING */
.loading{display:flex;align-items:center;justify-content:center;height:200px;gap:12px;color:#6b7280;font-size:14px}
.spin{width:20px;height:20px;border:2px solid #e5e7eb;border-top-color:#b91c1c;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* CARDS */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:10px;margin-bottom:22px}
.mod-card{background:#fff;border:1.5px solid #e5e7eb;border-radius:10px;padding:14px;cursor:pointer;transition:all .15s;display:flex;flex-direction:column;gap:10px}
.mod-card:hover{border-color:#b91c1c}
.mod-card.dim{opacity:.5;cursor:default}
.cico{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center}
.cico svg{width:15px;height:15px;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.cico.r{background:#fee2e2}.cico.r svg{stroke:#b91c1c}
.cico.b{background:#dbeafe}.cico.b svg{stroke:#1d4ed8}
.cname{font-size:12px;font-weight:700;color:#111827}
.csub{font-size:10px;color:#6b7280}
.badge{display:inline-flex;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:600}
.badge.on{background:#dcfce7;color:#166534}
.badge.wip{background:#fef3c7;color:#92400e}
.sec-title{font-size:11px;font-weight:600;color:#6b7280;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}

/* FORM */
.form-card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:24px;max-width:780px}
.form-ttl{font-size:14px;font-weight:600;color:#111827;margin-bottom:18px;display:flex;align-items:center;gap:8px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.f-grp{display:flex;flex-direction:column;gap:4px}
.f-grp.full{grid-column:1/-1}
label{font-size:12px;font-weight:500;color:#374151}
.req{color:#b91c1c}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid #d1d5db;border-radius:6px;font-size:14px;color:#111827;background:#fff;font-family:inherit;transition:border .15s;min-height:44px}
input:focus,select:focus,textarea:focus{outline:none;border-color:#b91c1c;box-shadow:0 0 0 2px rgba(185,28,28,.1)}
.f-actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.btn{padding:11px 22px;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;border:none;font-family:inherit;transition:all .15s;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn-p{background:#b91c1c;color:#fff}.btn-p:hover{background:#991b1b}
.btn-s{background:#f3f4f6;color:#374151;border:1px solid #e5e7eb}.btn-s:hover{background:#e5e7eb}
.btn-sm{padding:7px 14px;font-size:12px;min-height:36px}
.btn-d{background:#fee2e2;color:#b91c1c}.btn-d:hover{background:#fecaca}
.btn-g{background:#dcfce7;color:#166534}.btn-g:hover{background:#bbf7d0}

/* TABLE */
.tbl-card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden;max-width:1200px}
.tbl-toolbar{padding:12px 18px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #e5e7eb;flex-wrap:wrap}
.tbl-title{font-size:14px;font-weight:600;color:#111827;flex:1}
.fil-sel{padding:8px 10px;border:1px solid #d1d5db;border-radius:6px;font-size:12px;color:#374151;background:#fff;cursor:pointer;font-family:inherit;min-height:40px}
.twrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{padding:9px 11px;text-align:left;font-size:11px;font-weight:600;color:#6b7280;background:#f9fafb;border-bottom:1px solid #e5e7eb;white-space:nowrap}
td{padding:9px 11px;border-bottom:1px solid #f3f4f6;color:#374151;white-space:nowrap;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafafa}
.tbl-empty{padding:48px;text-align:center;color:#9ca3af;font-size:13px}
.seqn{font-weight:600;color:#9ca3af;font-size:11px}
.elink{color:#b91c1c;cursor:pointer;font-size:12px;text-decoration:underline;background:none;border:none;font-family:inherit;padding:4px 0;min-height:36px;display:inline-flex;align-items:center}

/* PILLS */
.pill{display:inline-flex;align-items:center;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:600}
.pw{background:#fef3c7;color:#92400e}
.pa{background:#dbeafe;color:#1e40af}
.pd{background:#dcfce7;color:#166534}
.uw{background:#fef3c7;color:#a16207;font-weight:700}
.um{background:#ffedd5;color:#c2410c;font-weight:700}
.uh{background:#fee2e2;color:#b91c1c;font-weight:700}

/* STATS */
.stats-bar{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.sbox{background:#fff;border:1px solid #e5e7eb;border-radius:8px;padding:12px 16px;min-width:90px}
.sval{font-size:22px;font-weight:600;color:#111827}
.slbl{font-size:11px;color:#6b7280;margin-top:2px}
.sbox.r .sval{color:#b91c1c}
.sbox.b .sval{color:#1d4ed8}
.sbox.g .sval{color:#059669}

/* MODAL */
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px}
.modal{background:#fff;border-radius:12px;padding:24px;width:100%;max-width:540px;max-height:90vh;overflow-y:auto}
.modal-ttl{font-size:15px;font-weight:600;color:#111827;margin-bottom:16px}

/* ADMIN */
.adm-wrap{display:grid;grid-template-columns:1fr 1fr;gap:20px;max-width:960px}
.adm-card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:20px}
.adm-sec-ttl{font-size:13px;font-weight:600;color:#374151;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid #f3f4f6}
.plist{display:flex;flex-direction:column;gap:6px}
.pitem{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:#f9fafb;border-radius:6px;font-size:13px;color:#374151}
.add-row{display:flex;gap:8px;margin-top:8px}
.add-row input{flex:1}

/* VEHICLES */
.veh-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.veh-card{background:#f9fafb;border:1.5px solid #e5e7eb;border-radius:10px;padding:14px}
.veh-card.inuse{border-color:#bfdbfe;background:#eff6ff}
.veh-plate{font-size:16px;font-weight:700;color:#111827}
.veh-model{font-size:11px;color:#6b7280;margin-top:2px}
.veh-mile{font-size:12px;color:#374151;margin-top:6px}
.veh-add{border:2px dashed #e5e7eb;background:#fafafa;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:110px;border-radius:10px}
.veh-add:hover{border-color:#b91c1c}
.veh-add svg{width:22px;height:22px;stroke:#9ca3af;fill:none;stroke-width:2}

/* CARD LIST (tablet) */
.card-list{display:none;flex-direction:column;gap:10px;padding:12px}
.rec-card{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:14px}
.rc-hdr{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px}
.rc-plate{font-size:15px;font-weight:700;color:#111827}
.rc-sub{font-size:12px;color:#6b7280;margin-top:2px}
.rc-body{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin-bottom:12px}
.rc-f{display:flex;flex-direction:column;gap:1px}
.rc-lbl{font-size:10px;color:#9ca3af;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.rc-val{font-size:13px;color:#374151;font-weight:500}
.rc-act{display:flex;gap:8px;padding-top:10px;border-top:1px solid #f3f4f6;flex-wrap:wrap}
.rc-extra{display:none;margin-top:10px;padding-top:10px;border-top:1px solid #f3f4f6;grid-template-columns:1fr 1fr;gap:6px 12px}
.rc-extra.open{display:grid}
.rc-more{font-size:11px;color:#6b7280;cursor:pointer;background:none;border:none;font-family:inherit;padding:0;text-decoration:underline}

/* MISC */
.info-box{background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;padding:12px 14px;font-size:12px;color:#1e40af;margin-bottom:16px}
.warn-box{background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:12px 14px;font-size:12px;color:#92400e;margin-bottom:16px}
.tab-bar{display:flex;gap:2px;background:#f3f4f6;border-radius:8px;padding:3px;margin-bottom:16px;width:fit-content}
.tab-btn{padding:8px 18px;border-radius:6px;border:none;background:transparent;font-size:13px;font-weight:500;color:#6b7280;cursor:pointer;font-family:inherit;transition:all .15s;min-height:40px}
.tab-btn.active{background:#fff;color:#111827;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.construction{display:flex;flex-direction:column;align-items:center;justify-content:center;height:300px;color:#9ca3af;gap:12px}
.construction svg{width:48px;height:48px;stroke:#d1d5db;fill:none;stroke-width:1.5}
.construction h3{font-size:18px;color:#6b7280}
.back-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;border:1px solid #e5e7eb;background:#fff;color:#374151;font-size:13px;cursor:pointer;font-family:inherit;margin-bottom:16px;transition:all .15s;min-height:40px}
.back-btn:hover{background:#f3f4f6}
.back-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.5}
</style>
</head>

<script>
// ══════════════════════════════════════════════════════
// Supabase 設定
// ══════════════════════════════════════════════════════
const SUPA_URL = 'https://rniygnovzyptnawjrdqy.supabase.co';
const SUPA_KEY = 'sb_publishable_9g8iELe4QJ2GLVcO8UoD_A_3mGexd03';

const supa = {
  async query(table, method='GET', body=null, params=''){
    const url = `${SUPA_URL}/rest/v1/${table}${params}`;
    const headers = {
      'apikey': SUPA_KEY,
      'Authorization': `Bearer ${SUPA_KEY}`,
      'Content-Type': 'application/json',
      'Prefer': method==='POST'?'return=representation':'return=representation'
    };
    const res = await fetch(url, {method, headers, body: body?JSON.stringify(body):null});
    if(!res.ok){ const t=await res.text(); throw new Error(t); }
    const txt = await res.text();
    return txt ? JSON.parse(txt) : null;
  },
  async getSetting(key){ const r=await this.query('mj_settings',`GET`,null,`?key=eq.${key}`); return r&&r[0]?JSON.parse(r[0].value):null; },
  async setSetting(key,val){ await this.query('mj_settings','POST',{key,value:JSON.stringify(val)},`?on_conflict=key`); },
  async getAll(table){ const r=await this.query(table,'GET',null,'?order=id.asc'); return r?r.map(row=>row.data):[];},
  async upsert(table,id,data){ await this.query(table,'POST',{id,data},`?on_conflict=id`); },
  async delete(table,id){ await this.query(table,'DELETE',null,`?id=eq.${id}`); },
};

// ══════════════════════════════════════════════════════
// State
// ══════════════════════════════════════════════════════
let repairs=[],loans=[],vehicles=[],staff=[],techs=[],cares=[],careSources=[],urgencyDefault='低';
let repairFilter='all', careFilter='all', adminTab='staff';

// ══════════════════════════════════════════════════════
// Init & Data Loading
// ══════════════════════════════════════════════════════
async function init(){
  try{
    [repairs, loans, cares] = await Promise.all([
      supa.getAll('mj_repairs'),
      supa.getAll('mj_loans'),
      supa.getAll('mj_cares'),
    ]);
    vehicles     = await supa.getSetting('vehicles')     || [{id:'v1',plate:'代步車-1',name:'Toyota Altis',model:'Altis 1.8',mileage:35200,active:true},{id:'v2',plate:'代步車-2',name:'Toyota Vios',model:'Vios 1.5',mileage:28400,active:true}];
    staff        = await supa.getSetting('staff')        || ['陳美玲','林志豪','王雅惠','張建宏'];
    techs        = await supa.getSetting('techs')        || ['李師傅','陳師傅','黃師傅','吳師傅'];

const today=()=>new Date().toISOString().split('T')[0];
const p2=n=>n.toString().padStart(2,'0');
const nowDT=()=>{const n=new Date();return `${n.getFullYear()}-${p2(n.getMonth()+1)}-${p2(n.getDate())} ${p2(n.getHours())}:${p2(n.getMinutes())}`;};
const toLocal=dt=>(dt||'').replace(' ','T');
const fmtDT=dt=>dt||'-';
const gv=id=>document.getElementById(id)?.value.trim()||'';
function showMsg(id,msg,color){
  const el=document.getElementById(id);if(!el)return;
  el.textContent=msg;el.style.color=color==='red'?'#b91c1c':'#059669';
  setTimeout(()=>{if(el)el.textContent='';},4000);
}
function pill(s){
  if(s==='wait')return '<span class="pill pw">等待中</span>';
  if(s==='active')return '<span class="pill pa">借用中</span>';
  return '<span class="pill pd">已還車</span>';
}
function carePill(s){
  if(s==='待處理')return '<span class="pill pw">待處理</span>';
  if(s==='處理中')return '<span class="pill pa">處理中</span>';
  return '<span class="pill pd">已結案</span>';
}
function urgBadge(u){
  if(u==='高')return '<span class="pill uh">高</span>';
  if(u==='中')return '<span class="pill um">中</span>';
  return '<span class="pill uw">低</span>';
}
function availVeh(){
  const used=loans.filter(l=>l.status==='active').map(l=>l.vehicleId);
  return vehicles.filter(v=>v.active&&!used.includes(v.id));
}
function calcWaitDays(){
  const sorted=loans.filter(l=>l.status==='active'&&l.expectedReturn).map(l=>new Date(l.expectedReturn)).sort((a,b)=>a-b);
  if(!sorted.length)return 0;
  return Math.max(0,Math.ceil((sorted[0]-new Date())/86400000));
}
async function updateWaitDays(){
  const now=new Date();
  const sorted=loans.filter(l=>l.status==='active'&&l.expectedReturn).map(l=>new Date(l.expectedReturn)).sort((a,b)=>a-b);
  const waiting=repairs.filter(r=>r.status==='wait');
  const toUpdate=[];
  waiting.forEach((r,i)=>{
    const d=sorted[i%Math.max(sorted.length,1)];
    const newDays=d?Math.max(0,Math.ceil((d-now)/86400000)):(r.repairDays?parseInt(r.repairDays):0);
    if(r.waitDays!==newDays){r.waitDays=newDays;toUpdate.push(r);}
  });
  if(toUpdate.length>0) await Promise.all(toUpdate.map(r=>supa.upsert('mj_repairs',r.id,r)));
}

async function autoScanCares(){
  const now=new Date();
  let changed=false;
  repairs.forEach(r=>{
    if(r.status==='wait'||r.status==='active'){
      const regDays=Math.floor((now-new Date(r.regDate))/86400000);
      if(regDays>=15){
        // 升級緊急度
        if(r.urgency==='低'){r.urgency='中';changed=true;}
        // 自動關懷
        const exists=cares.some(c=>c.sourceRepairId==r.id&&c.source==='auto');
        if(!exists){
          cares.push({id:Date.now()+Math.random(),seq:(cares.length+1).toString().padStart(4,'0'),plate:r.plate,name:r.name,phone:r.phone,reason:'等待代步車過久',careSource:'代步車',source:'auto',sourceRepairId:r.id,regDate:today(),staff:r.staff,careStatus:'待處理',careDt:'',careMethod:'',careNote:'',createdAt:new Date().toISOString()});
          changed=true;
        }
      }
    }
  });
  if(changed){
    const updatedRepairs=repairs.filter(r=>r.urgency==='中'&&Math.floor((now-new Date(r.regDate))/86400000)>=15);
    const newCares=cares.filter(c=>c.source==='auto');
    await Promise.all([
      ...updatedRepairs.map(r=>supa.upsert('mj_repairs',r.id,r)),
      ...newCares.map(c=>supa.upsert('mj_cares',Math.floor(c.id),c))
    ]);
  }
}

    <button class="tab-btn ${adminTab==='vehicles'?'active':''}" data-action="setAdminTab" data-val="vehicles">車輛管理</button>
    <button class="tab-btn ${adminTab==='settings'?'active':''}" data-action="setAdminTab" data-val="settings">系統設定</button>
  </div>
  ${adminTab==='staff'?renderAdminStaff():adminTab==='vehicles'?renderAdminVehicles():renderAdminSettings()}`;
}
function setAdminTab(t){adminTab=t;go('admin');}

function renderAdminStaff(){
  return `
  <div class="adm-wrap">
    <div class="adm-card">
      <div class="adm-sec-ttl">接待專員名單</div>
      <div class="plist">${staff.map((s,i)=>`<div class="pitem">${s}<button class="btn btn-d btn-sm" data-action="removePerson" data-val="staff" data-id="${i}">移除</button></div>`).join('')}</div>
      <div class="add-row"><input id="add-staff" placeholder="新增接待專員姓名"><button class="btn btn-p btn-sm" data-action="addPerson" data-val="staff">新增</button></div>
      <div id="staff-msg" style="font-size:12px;margin-top:6px"></div>
    </div>
    <div class="adm-card">
      <div class="adm-sec-ttl">技師名單</div>
      <div class="plist">${techs.map((t,i)=>`<div class="pitem">${t}<button class="btn btn-d btn-sm" data-action="removePerson" data-val="tech" data-id="${i}">移除</button></div>`).join('')}</div>
      <div class="add-row"><input id="add-tech" placeholder="新增技師姓名"><button class="btn btn-p btn-sm" data-action="addPerson" data-val="tech">新增</button></div>
      <div id="tech-msg" style="font-size:12px;margin-top:6px"></div>
    </div>
  </div>`;
}
async function addPerson(type){
  const inputEl=document.getElementById('add-'+type);
  const val=inputEl?.value.trim();
  if(!val){showMsg(type+'-msg','請輸入姓名','red');return;}
  if(type==='staff'){
    if(staff.includes(val)){showMsg('staff-msg','已存在','red');return;}
    staff.push(val);
    await supa.setSetting('staff',staff);
  } else {
    if(techs.includes(val)){showMsg('tech-msg','已存在','red');return;}
    techs.push(val);
    await supa.setSetting('techs',techs);
  }
  // 立即重新渲染人員清單區塊，不需要離開頁面
  go('admin');
  // 短暫顯示成功提示
  setTimeout(()=>{
    const msgEl=document.getElementById(type+'-msg');
    if(msgEl){msgEl.textContent='✓ 已新增「'+val+'」';msgEl.style.color='#059669';setTimeout(()=>{if(msgEl)msgEl.textContent='';},3000);}
  },100);
}
async function removePerson(type,idx){
  const i=parseInt(idx);
  const name=type==='staff'?staff[i]:techs[i];
  if(type==='staff'){staff.splice(i,1);await supa.setSetting('staff',staff);}
  else{techs.splice(i,1);await supa.setSetting('techs',techs);}
  go('admin');
  setTimeout(()=>{
    const msgEl=document.getElementById(type+'-msg');
    if(msgEl){msgEl.textContent='已移除「'+name+'」';msgEl.style.color='#6b7280';setTimeout(()=>{if(msgEl)msgEl.textContent='';},2000);}
  },100);
}

function renderAdminVehicles(){
  const usedIds=loans.filter(l=>l.status==='active').map(l=>l.vehicleId);
  return `
  <div class="veh-grid">
    ${vehicles.map(v=>{
      const inUse=usedIds.includes(v.id);
      const loan=loans.find(l=>l.vehicleId===v.id&&l.status==='active');
      return `<div class="veh-card ${inUse?'inuse':''}" style="opacity:${v.active?1:.55}">
        <div style="display:flex;justify-content:space-between;align-items:flex-start">
          <div><div class="veh-plate">${v.plate}</div><div class="veh-model">${v.model||'-'}</div></div>
          ${inUse?`<span class="pill pa" style="font-size:10px">借用中</span>`:`<span class="pill pd" style="font-size:10px">${v.active?'可用':'停用'}</span>`}
        </div>
        <div class="veh-mile">里程：<strong>${v.mileage?v.mileage.toLocaleString()+' km':'-'}</strong></div>
        ${inUse&&loan?`<div style="font-size:11px;color:#1e40af;margin-top:4px">借用人：${loan.name}</div>`:''}
        <div style="display:flex;gap:6px;margin-top:10px">
          <button class="btn btn-s btn-sm" data-action="openVehEdit" data-val="${v.id}">編輯</button>
          <button class="btn btn-d btn-sm" data-action="toggleVeh" data-val="${v.id}">${v.active?'停用':'啟用'}</button>
        </div>
      </div>`;
    }).join('')}
    <div class="veh-add" data-action="openAddVeh">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
      <span style="font-size:12px;color:#9ca3af">新增車輛</span>
    </div>
  </div>`;
}
function openAddVeh(){
  document.getElementById('modal-ttl').textContent='新增車輛';
  document.getElementById('modal-body').innerHTML=`
    <div class="fg">
      <div class="f-grp"><label>車牌號碼 <span class="req">*</span></label><input id="av-plate" placeholder="例：ABC-1234"></div>
      <div class="f-grp"><label>車輛名稱 <span class="req">*</span></label><input id="av-name" placeholder="例：Toyota Altis"></div>
      <div class="f-grp"><label>車型</label><input id="av-model" placeholder="例：Altis 1.8"></div>
      <div class="f-grp"><label>目前里程數（km）</label><input id="av-mile" type="number" min="0" placeholder="0"></div>
    </div>
    <div class="f-actions" style="margin-top:14px">
      <button class="btn btn-p" data-action="addVehicle">新增</button>
      <button class="btn btn-s" data-action="closeModal">取消</button>
    </div>
    <div id="av-msg" style="margin-top:8px;font-size:13px"></div>`;
  document.getElementById('modal').style.display='flex';
}
async function addVehicle(){
  const plate=gv('av-plate'),name=gv('av-name');
  if(!plate||!name){showMsg('av-msg','請填寫車牌與車輛名稱','red');return;}
  vehicles.push({id:'v'+Date.now(),plate:plate.toUpperCase(),name,model:gv('av-model'),mileage:parseInt(gv('av-mile'))||0,active:true});
  await supa.setSetting('vehicles',vehicles);
  closeModal();go('admin');
}
function openVehEdit(id){
  const v=vehicles.find(x=>x.id===id);if(!v)return;
  document.getElementById('modal-ttl').textContent='編輯車輛資訊';
  document.getElementById('modal-body').innerHTML=`
    <div class="fg">
      <div class="f-grp"><label>車牌號碼</label><input id="ev-plate" value="${v.plate}"></div>
      <div class="f-grp"><label>車輛名稱</label><input id="ev-name" value="${v.name}"></div>
      <div class="f-grp"><label>車型</label><input id="ev-model" value="${v.model||''}"></div>
      <div class="f-grp"><label>目前里程數（km）</label><input id="ev-mile" type="number" value="${v.mileage||0}"></div>
    </div>
    <div class="f-actions" style="margin-top:14px">
      <button class="btn btn-p" data-action="saveVehEdit" data-val="${id}">儲存</button>
      <button class="btn btn-s" data-action="closeModal">取消</button>
    </div>`;
  document.getElementById('modal').style.display='flex';
}
async function saveVehEdit(id){
  const idx=vehicles.findIndex(v=>v.id===id);if(idx<0)return;
  vehicles[idx]={...vehicles[idx],plate:gv('ev-plate').toUpperCase()||vehicles[idx].plate,name:gv('ev-name')||vehicles[idx].name,model:gv('ev-model'),mileage:parseInt(gv('ev-mile'))||vehicles[idx].mileage};
  await supa.setSetting('vehicles',vehicles);closeModal();go('admin');
}
async function toggleVeh(id){
  const idx=vehicles.findIndex(v=>v.id===id);if(idx<0)return;
  vehicles[idx].active=!vehicles[idx].active;
  await supa.setSetting('vehicles',vehicles);go('admin');
}

function renderAdminSettings(){
  return `
  <div class="adm-wrap">
    <div class="adm-card">
      <div class="adm-sec-ttl">關懷來源管理</div>
      <div class="plist">${careSources.map((s,i)=>`<div class="pitem">${s}<button class="btn btn-d btn-sm" data-action="removeCareSource" data-id="${i}">移除</button></div>`).join('')}</div>
      <div class="add-row"><input id="add-caresrc" placeholder="新增來源名稱"><button class="btn btn-p btn-sm" data-action="addCareSource">新增</button></div>
      <div id="caresrc-msg" style="font-size:12px;margin-top:6px"></div>
    </div>
    <div class="adm-card">
      <div class="adm-sec-ttl">緊急度預設值</div>
      <p style="font-size:12px;color:#6b7280;margin-bottom:12px">新增維修客戶時自動套用，可在總表點擊切換。</p>
      <div class="f-grp">
        <label>預設緊急度</label>
        <select id="urgency-sel" data-change-action="setUrgencyDefault">
          <option value="低" ${urgencyDefault==='低'?'selected':''}>低（黃）</option>
          <option value="中" ${urgencyDefault==='中'?'selected':''}>中（橘）</option>
          <option value="高" ${urgencyDefault==='高'?'selected':''}>高（紅）</option>
        </select>
      </div>
      <div style="margin-top:12px;display:flex;gap:8px;align-items:center">
        <span style="font-size:12px;color:#6b7280">目前預設：</span>${urgBadge(urgencyDefault)}
      </div>
      <div id="urgency-msg" style="font-size:12px;margin-top:8px"></div>
    </div>
  </div>`;
}
async function addCareSource(){
  const val=document.getElementById('add-caresrc')?.value.trim();
  if(!val){showMsg('caresrc-msg','請輸入來源名稱','red');return;}
  if(careSources.includes(val)){showMsg('caresrc-msg','已存在','red');return;}
  careSources.push(val);await supa.setSetting('careSources',careSources);go('admin');
}
async function removeCareSource(idx){
  careSources.splice(idx,1);await supa.setSetting('careSources',careSources);go('admin');
}
async function setUrgencyDefault(val){
  urgencyDefault=val;await supa.setSetting('urgencyDefault',urgencyDefault);
  showMsg('urgency-msg','✓ 已儲存','green');
  setTimeout(()=>go('admin'),800);
}

// ══════════════════════════════════════════════════════
// MISC
// ══════════════════════════════════════════════════════
function renderSoon(){return `<div class="construction"><svg viewBox="0 0 24 24"><path d="M12 2v4m0 12v4M4.93 4.93l2.83 2.83m8.48 8.48l2.83 2.83M2 12h4m12 0h4M4.93 19.07l2.83-2.83m8.48-8.48l2.83-2.83"/></svg><h3>建置中</h3><p>此模組開發中，敬請期待</p></div>`;}
function closeModal(){document.getElementById('modal').style.display='none';}

// ══════════════════════════════════════════════════════
// EVENT DELEGATION
// ══════════════════════════════════════════════════════
function handleAction(el){
  if(!el)return;
  const a=el.dataset.action;
  const id=el.dataset.id!==undefined?(isNaN(el.dataset.id)?el.dataset.id:Number(el.dataset.id)):undefined;
  const val=el.dataset.val;
  const actions={
    go:()=>go(val),
    submitRepair,clearRepairForm,
    openRepairEdit:()=>openRepairEdit(id),saveRepairEdit:()=>saveRepairEdit(id),deleteRepair:()=>deleteRepair(id),
    openLoanFromRepair:()=>openLoanFromRepair(id),submitLoanFromRepair:()=>submitLoanFromRepair(id),
    openReturnFromRepair:()=>openReturnFromRepair(id),confirmReturn:()=>confirmReturn(id),
    cycleUrgency:()=>cycleUrgency(id),toggleExtra:()=>toggleExtra(id),
    submitCare,clearCareForm,
    openCareEdit:()=>openCareEdit(id),saveCareEdit:()=>saveCareEdit(id),deleteCare:()=>deleteCare(id),
    setAdminTab:()=>setAdminTab(val),
    addPerson:()=>addPerson(val),removePerson:()=>removePerson(val,id),
    openAddVeh,addVehicle,openVehEdit:()=>openVehEdit(val),saveVehEdit:()=>saveVehEdit(val),toggleVeh:()=>toggleVeh(val),
    addCareSource,removeCareSource:()=>removeCareSource(id),
    closeModal,
  };
  if(actions[a]) actions[a]();
}

document.getElementById('ov').addEventListener('click',()=>{
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('ov').classList.remove('show');
});
document.getElementById('btn-menu').addEventListener('click',()=>{
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('ov').classList.add('show');
});
document.getElementById('modal').addEventListener('click',e=>{
  if(e.target.id==='modal'){closeModal();return;}
  handleAction(e.target.closest('[data-action]'));
});
document.getElementById('sidebar').addEventListener('click',e=>{
  const btn=e.target.closest('[data-page]');
  if(!btn)return;
  go(btn.dataset.page);
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('ov').classList.remove('show');
});
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-action]');
  if(el&&!el.closest('#modal'))handleAction(el);
});
document.addEventListener('change',e=>{
  const a=e.target.dataset.changeAction;
  if(!a)return;
  const v=e.target.value;
  const map={setRepairFilter,setCareFilter,setAdminTab,setUrgencyDefault};
  if(map[a])map[a](v);
});

init();
</script>
</body>
</html>
